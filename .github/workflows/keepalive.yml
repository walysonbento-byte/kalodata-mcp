# Mantém o serviço do Render (plano gratuito) acordado.
# O Render hiberna após ~15 min sem tráfego; a primeira chamada depois disso
# leva 20-60 s e o conector do Claude pode dar "ferramenta inacessível".
# A rota /health não chama a Kalodata, então o ping não gasta créditos.
name: Keep-alive Render

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # permite disparar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 120 \
            -o /dev/null -w "HTTP %{http_code} em %{time_total}s\n" \
            https://kalodata-mcp.onrender.com/health
